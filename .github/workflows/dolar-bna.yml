# Baja el dólar oficial del Banco Nación (vendedor) cada 15 minutos en horario bancario
# y lo guarda en shared/bna.json, que la app lee para calcular los pesos.
name: Dólar Banco Nación
on:
  schedule:
    - cron: '*/15 12-21 * * 1-5'   # 9 a 18 h de Argentina, lunes a viernes
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/bna.py', '.github/workflows/dolar-bna.yml']
permissions:
  contents: write
concurrency:
  group: dolar-bna
  cancel-in-progress: false
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar cotización
        id: bajar
        continue-on-error: true
        run: python3 .github/scripts/bna.py
      - name: Guardar cambios
        run: |
          git config user.name "dolar-bna"
          git config user.email "actions@users.noreply.github.com"
          for f in shared/bna.json shared/bna-debug.txt; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Nada para guardar"; exit 0; fi
          git commit -m "Dólar BNA: actualizar cotización"
          git pull --rebase --quiet origin main
          git push
      - name: Avisar si falló
        if: steps.bajar.outcome == 'failure'
        run: exit 1
